[pytest]
# חשוב: לא לשים כאן דגלים של xdist (כמו -n/--dist),
# כי בסביבות מינימליות (requirements/minimal.txt) pytest-xdist לא מותקן ואז pytest נופל על "unrecognized arguments".
# המקביליות מופעלת **רק** מפורשת בשורת הפקודה של CI (.github/workflows/ci.yml,
# הצעד "Run Tests"), עם -n auto --dist=loadscope. אין ב-conftest.py שום לוגיקה
# שמפעילה אותה — ההערה הקודמת כאן טענה שיש, ולא הייתה.
addopts = -q --maxfail=1 --disable-warnings --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=0
testpaths =
    tests
    .
asyncio_mode = auto

markers =
    performance: בדיקות ביצועים
    heavy: טסטים כבדים (מדולגים כשמבקשים רק קלים)
    smoke: בדיקות smoke מהירות ויציבות שרצות על כל PR
    ui_full: סט בדיקות UI מלא שרץ nightly/לפני deploy
    flaky: בדיקות לא יציבות (לא חוסמות CI עד שמייצבים)
    integration: בדיקות אינטגרציה הדורשות שירותים חיצוניים (למשל MongoDB)

# Global per-test timeout to prevent silent hangs in CI
timeout = 60
# ואין כאן timeout_method, בכוונה. pytest-timeout בוחר בעצמו לפי הפלטפורמה —
# signal היכן שיש SIGALRM, thread היכן שאין — וזו כבר ההחלטה הנכונה לשתיהן.
#
# עד כאן היה כתוב כאן timeout_method = thread, וזאת דריסה שעלתה ביוקר: בשיטה
# הזאת pytest_timeout קורא os._exit(1), כלומר טסט שחורג **אינו נכשל** אלא הורג
# את התהליך שמריץ אותו. תחת xdist ה-controller רק רואה תהליך שנעלם ומדפיס
# "node down: Not properly terminated" — בלי שם הטסט, בלי שורה ובלי מחסנית,
# כי ה-worker כותב אותן ל-stderr שלו ויוצא לפני שהפלט נשטף.
#
# נמדד, עם תקרה של 3 שניות במקום 60, על טסט שישן 10 שניות ועוד שניים סביבו:
# עם thread התהליך מת, אין שורת סיכום, ואפילו הטסט שאחריו לא רץ. בברירת
# המחדל הטסט האיטי נכשל **בשמו** ושני האחרים עברו. ונמדד גם שברירת המחדל
# תופסת את כל שלוש הצורות שחשדתי שיישברו בהן: תקיעה ב-thread שאינו הראשי,
# קריאת C חוסמת, וטסטים אסינכרוניים בשתי הצורות.
#
# מי שמחזיר את השורה הזאת מחזיר גם את מחיקת הראיה. אם צריך thread לטסט
# מסוים — יש @pytest.mark.timeout(method="thread") נקודתי.

