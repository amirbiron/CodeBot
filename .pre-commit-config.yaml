repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: |
          (?x)(
            ^node_modules/
            | ^docs/_build/
            | ^tmp/
            | ^webapp/
          )
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length=120"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--extend-ignore=E203,W503"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-requests", "types-python-dateutil"]
        args: ["--config-file", "mypy.ini"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        # אל תשתמש בקובץ קונפיג חיצוני כדי למנוע כשל כשאינו קיים

  # hook מקומי ולא מ-repo חיצוני: הכלל הזה הוא של הריפו הזה, והסקריפט
  # הוא מקור האמת היחיד שגם ה-CI קורא לו. תלות חיצונית הייתה מקום שני.
  - repo: local
    hooks:
      - id: no-committed-pyc
        name: אין קבצי bytecode במעקב גיט
        entry: python scripts/check_no_committed_pyc.py
        language: system
        # ``types: [file]`` ולא ``[python]``: pre-commit מזהה ``.pyc``
        # כבינארי ולא כ-Python, ומסנן אותו עוד לפני שה-hook רץ — כלומר
        # סינון לפי סוג היה מסתיר בדיוק את מה שאנחנו מחפשים.
        types: [file]
        # הקבצים ב-staging מועברים כארגומנטים, ולכן זו בדיקה על מה
        # שהקומיט הזה מוסיף. ה-CI מריץ את אותו סקריפט בלי ארגומנטים,
        # ושם הוא בודק את **כל** העץ — גם קובץ שנכנס מזמן.
        pass_filenames: true

# Pre-commit global settings
default_language_version:
  python: python3.11
exclude: |
  (?x)(
    ^node_modules/
    | ^docs/_build/
    | ^tmp/
  )