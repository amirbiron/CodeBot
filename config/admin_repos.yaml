# רשימת ריפוים להצגה בדשבורד (אדמין בלבד)
#
# הרשימה מוצגת בכרטיס "הריפוים שלי" בדשבורד, במקום כרטיס "מה חדש".
# הכרטיס גלוי רק למשתמשי אדמין – משתמש רגיל לא רואה אותו כלל,
# והנתונים אפילו לא נשלחים ל-HTML שלו.
#
# כל קישור נפתח בטאב חדש בדפדפן, כך ש-CodeKeeper נשאר פתוח מאחור
# (חשוב במיוחד כשמשתמשים באפליקציה המותקנת / PWA).
#
# שדות:
#   - name: שם לתצוגה (חובה)
#   - url: כתובת הריפו (חובה, חייבת להתחיל ב-http:// או https://)
#   - description: תיאור קצר (אופציונלי)
#   - icon: אימוג'י (אופציונלי, ברירת מחדל: 📦)
#   - badge: תגית קצרה כמו "ראשי" / "ארכיון" (אופציונלי)
#
# אחרי עריכה השינוי נכנס לתוקף תוך 5 דקות (cache), או מיד לאחר deploy.

repos:
  - name: "CodeBot"
    url: "https://github.com/amirbiron/CodeBot"
    description: "הריפו הראשי של CodeKeeper"
    icon: "🤖"
    badge: "ראשי"

  - name: "claude-skills"
    url: "https://github.com/amirbiron/claude-skills"
    description: "רשימת סקילים אישיים"
    icon: "🧩"

  - name: "israel-drugs-mcp-server"
    url: "https://github.com/amirbiron/israel-drugs-mcp-server"
    description: "סקיל התרופות | CC"
    icon: "💊"

  - name: "amir-bug-patterns"
    url: "https://github.com/amirbiron/amir-bug-patterns"
    description: "דפוסי באגים שחוזרים"
    icon: "🕷️"
