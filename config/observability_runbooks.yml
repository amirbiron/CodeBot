version: 1
default: generic_incident_flow
runbooks:
  high_error_rate:
    title: "זינוק בשיעור השגיאות"
    description: "Playbook מהיר לזיהוי וטיפול בהתראות error_rate גבוה."
    aliases:
      - error_rate_spike
      - high_errors
    steps:
      - id: focus_timeline
        title: "התמקד בחלון הזמן הנכון"
        description: "פתח Incident Replay סביב מועד ההתראה כדי להבין מה הוביל לזינוק."
        action:
          label: "⏪ Incident Replay"
          type: link
          href: "/admin/observability/replay?timerange=3h&focus_ts={{timestamp}}"
          safety: safe
      - id: run_triage_errors
        title: "משוך /triage errors"
        description: "הרץ את פקודת ChatOps כדי לקבל דגימות שגיאה והקשרים מהלוגים."
        action:
          label: "🧪 /triage errors"
          type: copy
          payload: "/triage errors"
          safety: safe
  slow_response:
    title: "Latency גבוה / שירות איטי"
    description: "מסלול טיפול בביצועים איטיים או בזינוקי P95."
    aliases:
      - latency_spike
      - slow_response_time
      - heavy_query_detected
    steps:
      - id: replay_latency
        title: "בדוק את ציר הזמן"
        description: "חפש Deployment קרוב או אירועי ChatOps שמשפיעים על latency."
        action:
          label: "🔎 פתח Replay"
          type: link
          href: "/admin/observability/replay?timerange=6h&focus_ts={{timestamp}}"
          safety: safe
      - id: run_triage_latency
        title: "הרץ /triage latency"
        description: "הפקודה מושכת מדדי שרת וחוסכת חיבור ידני לגרפנה."
        action:
          label: "⚙️ /triage latency"
          type: copy
          payload: "/triage latency"
          safety: safe
      - id: check_cache_hit_rate
        title: "בדוק יעילות Cache (Hit Rate)"
        description: "אם ה-Hit Rate נמוך מ-30%, העומס עובר ל-DB. בדשבורד בדוק אם מפתחות נמחקים מהר מדי ב-Cache Inspector."
        action:
          label: "💾 Cache Inspector"
          type: link
          href: "/admin/cache-inspector"
          safety: safe
      - id: check_heavy_projections
        title: "בדוק Heavy Projections (Potential Missing Projection)"
        description: "אם מופיע COLLSCAN/Slow Query – בדוק שלא מושכים שדות כבדים ברשימות, ושיש Explicit Fetch לתוכן מלא."
        action:
          label: "📘 Performance Bible (אופטימיזציה)"
          type: link
          href: "https://github.com/amirbiron/CodeBot/blob/main/docs/performance-bible.md"
          safety: safe
      - id: review_connection_pooling
        title: "וודא הגדרות Connection Pool"
        description: "חזור לסעיף ה-Troubleshooting במדריך Connection Pooling."
        action:
          label: "🧭 מדריך Latency"
          type: link
          href: "https://github.com/amirbiron/CodeBot/blob/main/GUIDES/GUIDE_CONNECTION_POOLING.md"
          safety: safe
  db_connection_issue:
    title: "כשלים מול בסיס הנתונים"
    description: "צעדים לטיפול ב-DB connection issue לפני Escalation."
    aliases:
      - db_connection_error
      - db_connection_issue
      - db_conn_error
      - replicasetnoprimary
      - no_replica_set_members
      - ssl_handshake_failed
      - operationcancelled
    steps:
      - id: vendor_status_atlas
        title: "בדוק סטטוס ספק (MongoDB)"
        description: "אם יש תקלה עולמית אצל MongoDB/Atlas – לרוב אין מה לתקן אצלנו, רק לעקוב ולעדכן סטטוס."
        action:
          label: "🌐 MongoDB Status"
          type: link
          href: "https://status.mongodb.com/"
          safety: safe
      - id: db_health_dashboard
        title: "מצב בריאות DB (חיבורים ו-Ping)"
        description: "ראה בזמן אמת אם השרת מצליח לייצר חיבורים למונגו ואת זמני התגובה."
        action:
          label: "🏥 DB Health"
          type: link
          href: "/admin/db-health"
          safety: safe
      - id: check_profiler_load
        title: "פרופיילר שאילתות (Slow Queries)"
        description: "בדוק אם עומס שאילתות (Queue) גורם לניתוקים או איטיות בחיבור."
        action:
          label: "🐢 Profiler Dashboard"
          type: link
          href: "/admin/profiler"
          safety: safe
      - id: check_mongodb_url
        title: "ודא קונפיג בסיסי"
        description: "בדוק ש-`MONGODB_URL` מוגדר ונראה תקין. את `YOUR_MONGODB_HOST` קח מתוך ה-URL (לרוב הדומיין אחרי `@`, למשל `cluster0.mongodb.net`)."
      - id: check_dns
        title: "בדוק DNS מהשרת"
        description: "אם DNS לא פותר את הדומיין של MongoDB – זו בעיית רשת/DNS ולא בעיית קוד."
        action:
          label: "📋 העתק פקודת DNS"
          type: copy
          payload: "getent hosts YOUR_MONGODB_HOST"
          safety: caution
      - id: check_tcp_27017
        title: "בדוק TCP לפורט 27017"
        description: "אם החיבור ל-27017 נכשל/נתקע – בדוק Firewall/NAT/Network Access ב-Atlas."
        action:
          label: "📋 העתק בדיקת TCP"
          type: copy
          payload: "timeout 5 bash -lc 'cat < /dev/null > /dev/tcp/YOUR_MONGODB_HOST/27017'"
          safety: caution
      - id: check_tls_handshake
        title: "בדוק TLS (אם יש SSL handshake failed)"
        description: "כשל TLS יכול להיות בגלל זמן מערכת, CA bundle, או שינויי מדיניות TLS."
        action:
          label: "📋 העתק בדיקת TLS"
          type: copy
          payload: "timeout 8 openssl s_client -connect YOUR_MONGODB_HOST:27017 -servername YOUR_MONGODB_HOST -brief < /dev/null"
          safety: caution
      - id: check_atlas_allowlist
        title: "בדוק IP allowlist (Atlas Network Access)"
        description: "וודא שה-egress IP של השרת מורשה. מומלץ `x.x.x.x/32`. לא מומלץ לפתוח `0.0.0.0/0` (רק כחריג קצר-זמן ובכפוף למדיניות אבטחה, ואז להחזיר מיד)."
      - id: copy_triage_db
        title: "הרץ /triage db"
        description: "מקבל את סטטוס ה-Pool ומספר החיבורים הפעילים."
        action:
          label: "🗄️ /triage db"
          type: copy
          payload: "/triage db"
          safety: caution
      - id: check_backup_runbook
        title: "בדוק את Playbook ה-DB"
        description: "וודא שהגיבוי האחרון והבדיקות האוטומטיות עברו."
        action:
          label: "🛠️ בדיקת DB"
          type: link
          href: "/GUIDES/BACKUP_RESTORE.md#db-health-check"
          safety: caution
      - id: open_incident_replay_db
        title: "בדוק הקשרים נוספים"
        description: "פתח שוב את Incident Replay כדי לבדוק אם יש התראות נוספות סביב אותה שעה."
        action:
          label: "⏱️ הקשר נוסף"
          type: link
          href: "/admin/observability/replay?timerange=1h&focus_ts={{timestamp}}"
          safety: safe
  # 💾 1. בעיות משאבים (דיסק/זיכרון)
  resource_exhaustion:
    title: "צריכת משאבים קריטית (CPU/RAM/Disk)"
    description: "השרת מתקרב לקצה גבול היכולת. סכנת קריסה מיידית."
    aliases:
      - high_cpu
      - high_memory
      - disk_full
    steps:
      - id: check_system_health
        title: "הרץ /triage system"
        description: "קבל תמונת מצב של Top Processes וניצול דיסק."
        action:
          label: "💻 /triage system"
          type: copy
          payload: "/triage system"
          safety: safe
      - id: check_profiler_cpu
        title: "ניתוח שאילתות איטיות (CPU High)"
        description: "בדוק אם יש שאילתות COLLSCAN או אגרגציות כבדות שגורמות לעומס CPU."
        action:
          label: "🐢 Profiler Dashboard"
          type: link
          href: "/admin/profiler"
          safety: safe
      - id: clear_cache_suggestion
        title: "שקול ניקוי Cache"
        description: "אם הזיכרון מלא בגלל Redis, הרץ ניקוי Stale מבוקר דרך ChatOps."
        action:
          label: "🧹 /cache_clear_stale"
          type: copy
          payload: "/cache_clear_stale"
          safety: caution
  # ⚙️ 2. תורים ומשימות רקע
  worker_lag:
    title: "עיכוב בעיבוד משימות רקע"
    description: "התור (Queue) עמוס או שה-Worker נתקע."
    aliases:
      - queue_spike
      - worker_down
      - job_failure
    steps:
      - id: check_worker_status
        title: "סטטוס Sidecar Worker"
        description: "בדוק האם ה-Worker מחובר ומחזיר /healthz תקין."
        action:
          label: "👷 /status_worker"
          type: copy
          payload: "/status_worker"
          safety: safe
      - id: check_queue_depth
        title: "בדוק עומק תור"
        description: "האם יש הצטברות חריגה של משימות?"
        action:
          label: "📊 /triage queues"
          type: copy
          payload: "/triage queues"
          safety: safe
      - id: visual_queue_monitor
        title: "פתח דשבורד משימות (Jobs)"
        description: "בדוק ויזואלית אילו ג'ובים נכשלים (Failed) או תקועים (Active זמן רב)."
        action:
          label: "⚙️ Jobs Monitor"
          type: link
          href: "/jobs/monitor"
          safety: safe
  # ☁️ 3. תקלות צד ג' (ספקים)
  external_outage:
    title: "כשל בשירות חיצוני"
    description: "שגיאות בחיבור ל-GitHub, AWS, או ספקים אחרים."
    aliases:
      - github_api_error
      - s3_error
      - external_api_timeout
    steps:
      - id: focus_replay_external
        title: "פתח Incident Replay סביב השעה"
        description: "לפני שמסיקים מסקנות, בדוק אם יש עוד אירועים/דיפלויים סביב אותו זמן."
        action:
          label: "⏪ Incident Replay"
          type: link
          href: "/admin/observability/replay?timerange=3h&focus_ts={{timestamp}}"
          safety: safe
      - id: verify_external_keys
        title: "ודא מפתחות API (Secrets)"
        description: "הכנס ל-Config Inspector וודא שה-API Keys של הספק מוגדרים ולא ריקים."
        action:
          label: "🔑 בדיקת מפתחות"
          type: link
          href: "/admin/config-inspector"
          safety: safe
      - id: check_status_openai
        title: "בדוק סטטוס OpenAI"
        description: "אם יש תקלה אצל הספק – לרוב הפתרון הוא המתנה/הודעת סטטוס למשתמשים."
        action:
          label: "🌐 OpenAI Status"
          type: link
          href: "https://status.openai.com/"
          safety: safe
      - id: check_status_telegram
        title: "בדוק סטטוס Telegram"
        description: "אם Telegram למטה – הודעות יכולות להיתקע/להיכשל."
        action:
          label: "🌐 Telegram Status"
          type: link
          href: "https://status.telegram.org/"
          safety: safe
      - id: check_status_github
        title: "בדוק סטטוס GitHub"
        description: "רלוונטי לתקלות API/Rate limit של GitHub או השהיות כלליות."
        action:
          label: "🌐 GitHub Status"
          type: link
          href: "https://www.githubstatus.com/"
          safety: safe
      - id: run_errors_fallback
        title: "משוך /errors"
        description: "פקודה מהירה שמציפה שגיאות אחרונות (fallback כשאין תמונה מלאה)."
        action:
          label: "🚨 /errors"
          type: copy
          payload: "/errors"
          safety: safe

  rate_limit_warning:
    title: "חריגת מגבלת בקשות (Rate Limit)"
    description: "משתמש או בוט חיצוני הגיעו למגבלת הבקשות המותרת."
    aliases:
      - ratelimit_exceeded
      - too_many_requests
      - 429_too_many_requests
    steps:
      - id: check_limits_inspector
        title: "בדוק חסימות ב-Inspector"
        description: "חפש מפתחות מסוג LIMITS כדי לראות מי ה-IP החסום ולכמה זמן."
        action:
          label: "🛡️ Cache Inspector"
          type: link
          href: "/admin/cache-inspector?search=LIMITS"
          safety: safe
      - id: analyze_traffic_source
        title: "נתח את מקור התעבורה"
        description: "האם זה משתמש לגיטימי או בוט סורק? בדוק לוגים."
        action:
          label: "🔎 /triage <user_id>"
          type: copy
          payload: "/triage "
          safety: safe

  deployment_event:
    title: "אחרי Deploy – בדיקת רגרסיה/כשל"
    description: "צעדים מהירים כשמיד אחרי דיפלוי מתחילות חריגות/500 או שבר בפיצ'ר."
    aliases:
      - deployment_error
      - deploy_error
      - release_regression
      - observability_aggregations_failed
    steps:
      - id: replay_deploy_window
        title: "פתח Replay סביב הדיפלוי"
        description: "בדוק אם יש קורלציה בין הדיפלוי לזינוק בשגיאות/לטנציה."
        action:
          label: "⏪ Incident Replay"
          type: link
          href: "/admin/observability/replay?timerange=3h&focus_ts={{timestamp}}"
          safety: safe
      - id: verify_config_vars
        title: "ודא טעינת קונפיגורציה"
        description: "בדוק בדשבורד-Config Inspector שהמשתנים החדשים (כמו Feature Flags או API Keys) נטענו כראוי."
        action:
          label: "🛠️ Config Inspector"
          type: link
          href: "/admin/config-inspector"
          safety: safe
      - id: check_recent_errors
        title: "משוך /errors"
        description: "ראה מהר אילו חריגות חוזרות (TypeError, 500, וכו')."
        action:
          label: "🚨 /errors"
          type: copy
          payload: "/errors"
          safety: safe
      - id: verify_stale_cache
        title: "חשד למידע תקוע (Stale Cache)"
        description: "אם משתמשים רואים מידע ישן או UI שבור, נקה מפתחות רלוונטיים."
        action:
          label: "🧹 Cache Inspector"
          type: link
          href: "/admin/cache-inspector"
          safety: caution
      - id: check_version_history
        title: "בדוק /version_history"
        description: "וודא איזו גרסה עלתה ומתי."
        action:
          label: "🚀 /version_history"
          type: copy
          payload: "/version_history"
          safety: safe
      - id: triage_with_request_id
        title: "אם יש request_id – הרץ /triage"
        description: "כשיש מזהה בקשה, /triage נותן קישורים ישירים ללוגים/הקשר."
        action:
          label: "📋 /triage <request_id>"
          type: copy
          payload: "/triage "
          safety: safe
      - id: rollback_if_needed
        title: "אם יש פגיעה בפרודקשן – rollback"
        description: "בצע rollback דרך CI/CD או החזרת image/tag קודם. הימנע מפקודות git הרסניות על שרת פרודקשן."
  # ההתראה ש-services/docs_index_service.py שולח כשמעבר של אינדקס התיעוד נכנס להמתנה לאישור (ALERT_APPROVAL_NEEDED שם).
  # הצעד הראשון הוא שורת ה-Quick Fix בהודעה בבוט.
  docs_index_approval_needed:
    title: "אינדקס התיעוד מחכה לאישור"
    description: "מעבר של אינדקס התיעוד עצר לפני ההטמעה, כי התוכנית שלו דורשת אישור: מילוי ראשון או החלפת מודל, יותר נתחים להטמעה מהתקרה, או תוכנית שהשתנתה מאז שאושרה. מיזוג שבא אחריו מחשב את הפער המצטבר מחדש, ולכן בדרך כלל עוצר גם הוא."
    steps:
      - id: review_and_approve
        title: "בדוק את התוכנית ואשר"
        description: "בעמוד האדמין של האינדקס מופיעים מספר הנתחים שיישלחו להטמעה, הקומיט שנבדק והקומיט שהאינדקס נכון אליו. האישור מריץ את התוכנית שמוצגת שם."
        action:
          label: "📚 אשר בעמוד אינדקס התיעוד"
          type: link
          href: "/admin/docs-index"
          safety: safe
  generic_incident_flow:
    title: "פלייבוק כללי להתראות"
    description: "Fallback בסיסי המתאים לכל alert_type ללא Runbook ייעודי."
    default: true
    steps:
      - id: open_focus_link
        title: "פתח את האירוע בלוח"
        description: "הקפץ את הלוח לטווח הזמן של ההתראה כדי לראות מדדים רלוונטיים."
        action:
          label: "📍 פתח בלוח"
          type: link
          href: "/admin/observability?focus_ts={{timestamp}}"
          safety: safe
      - id: run_errors_command
        title: "משוך /errors"
        description: "פקודת ברירת מחדל שמציפה 5 שגיאות אחרונות."
        action:
          label: "🚨 /errors"
          type: copy
          payload: "/errors"
          safety: safe
      - id: check_recent_deploys
        title: "בדוק גרסאות אחרונות"
        description: "האם עלתה גרסה ב-30 הדקות האחרונות? שלוף את יומן הדפלויים."
        action:
          label: "🚀 /version_history"
          type: copy
          payload: "/version_history"
          safety: safe
      - id: review_replay
        title: "בדוק את Incident Replay"
        description: "תמיד כדאי להציץ בציר הזמן כדי לראות אם יש Runbook יעודי אחר."
        action:
          label: "⏪ Incident Replay"
          type: link
          href: "/admin/observability/replay?timerange=6h"
          safety: safe

# --- Quick Fix חכם (דינמי) לפי Queue Delay + עומס/DB ---
# הערה: זה קונפיג עבור הלוגיקה הדינמית בשרת/בוט. כשחסרים נתונים (למשל אין pool/resource metrics)
# הלוגיקה עושה fallback בטוח ולא שוברת UI.
quick_fix_rules:
  latency_v1:
    enabled: true
    thresholds:
      queue_delay_ms: 500
      duration_ms: 3000
      pool_utilization_high_pct: 90
      pool_utilization_low_pct: 20
      cpu_high_pct: 85
      memory_high_pct: 85
      cpu_low_pct: 30
      memory_low_pct: 30
      active_requests_low: 2
    actions:
      queue_pool_high:
        label: "🔌 הגדל Connection Pool / Kill Slow Queries"
        type: copy
        payload: "/triage db"
        safety: caution
        description: "Queueing גבוה + לחץ על DB: בדוק pool utilization / minPoolSize, ושאילתות איטיות."
      queue_resources_high:
        label: "📈 Scale Up / Add Workers"
        type: copy
        payload: "/triage system"
        safety: safe
        description: "Queueing גבוה + עומס CPU/RAM: כנראה צריך עוד משאבים/Workers."
      queue_stuck_workers:
        label: "🔄 Restart Service (Stuck Workers)"
        type: copy
        payload: "/status_worker"
        safety: caution
        description: "Queueing גבוה אבל שימוש נמוך: חשד ל-workers תקועים/deadlock."
      queue_generic:
        label: "📈 Scale Up"
        type: copy
        payload: "/triage system"
        safety: safe
        description: "Queueing גבוה ללא אינדיקציה ברורה: התחל מ-scaling ואז העמק."
      processing_mongo:
        label: "🔍 בדוק אינדקסים / currentOp (Slow Query)"
        type: copy
