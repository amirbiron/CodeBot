{% extends "base.html" %}

{% block title %}לוח פתקים - Code Keeper Bot{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sticky-notes.css') }}?v={{ static_version }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/note-boards.css') }}?v={{ static_version }}">
{% endblock %}

{% block content %}
<div class="boards-page is-board-surface">

  <div class="board-msg is-error" id="boardMsg" hidden></div>

  <div class="board-surface-wrap">
    <div class="board-toolbar">
      <input type="text" class="board-title-input" id="boardTitle" value="" aria-label="שם הלוח">
      <button type="button" class="board-icon-link" id="boardSettingsBtn"
              title="הגדרות הלוח" aria-label="הגדרות הלוח" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <a href="/boards" class="board-icon-link" title="כל הלוחות" aria-label="כל הלוחות">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </a>
    </div>
    <div class="board-settings-modal" id="boardSettings" role="dialog" aria-modal="true"
         aria-labelledby="boardSettingsTitle" hidden>
      <div class="board-settings-backdrop" data-close></div>
      <div class="board-settings-card">
        <h2 id="boardSettingsTitle">הגדרות הלוח</h2>
        <label class="board-setting-row">
          <input type="checkbox" id="infiniteScrollToggle">
          <span>
            <b>גלילה אינסופית</b>
            <small>הלוח ממשיך להתרחב כלפי מטה, כך שתמיד יש לאן לגרור פתקים.</small>
          </span>
        </label>
        <p class="board-setting-note">
          כיבוי אינו מזיז אף פתק. אורך הלוח נמדד תמיד עד הפתק האחרון, ומתקצר רק עד שם.
        </p>
        <div class="board-settings-actions">
          <button type="button" class="board-action" data-close>סגור</button>
        </div>
      </div>
    </div>

    <div class="board-surface" id="boardSurface">
      <div class="board-empty" id="boardEmpty" hidden>
        <div>הלוח ריק.</div>
        <button class="board-action" id="firstNoteBtn">הוסיפו פתק ראשון</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>window.STICKY_NOTE_MAX_CHARS = {{ max_note_chars | tojson }};</script>
<script src="{{ url_for('static', filename='js/sticky-notes.js') }}?v={{ static_version }}"></script>
<script>
(function () {
  'use strict';

  const BOARD_ID = {{ board_id | tojson }};
  const surface = document.getElementById('boardSurface');
  const titleInput = document.getElementById('boardTitle');
  const msg = document.getElementById('boardMsg');
  const empty = document.getElementById('boardEmpty');

  function showError(text) {
    msg.textContent = text;
    msg.hidden = false;
  }

  function refreshEmptyState() {
    // ה-FAB הוא גם בן של המשטח, ולכן נספר רק פתקים
    const count = surface.querySelectorAll('.sticky-note').length;
    empty.hidden = count > 0;
  }

  async function loadBoard() {
    try {
      const resp = await fetch('/api/note-boards', { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) return;
      const board = (data.boards || []).find(function (b) { return String(b.id) === String(BOARD_ID); });
      if (board) {
        titleInput.value = board.name;
        document.title = board.name + ' - Code Keeper Bot';
      }
    } catch (e) { /* השם אינו קריטי לתפקוד הלוח */ }
  }

  titleInput.addEventListener('change', async function () {
    const name = titleInput.value.trim();
    if (!name) { loadBoard(); return; }
    try {
      const resp = await fetch('/api/note-boards/' + encodeURIComponent(BOARD_ID), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) {
        showError('שינוי השם נכשל.');
        loadBoard();  // חוזרים למה שבשרת, לא משאירים ערך שלא נשמר
        return;
      }
      msg.hidden = true;
      titleInput.value = data.board.name;
    } catch (e) {
      showError('שינוי השם נכשל.');
      loadBoard();
    }
  });

  // המשטח הוא הקונטיינר, ואין בו ``#md-content`` — ולכן כל מסלול העיגון
  // לשורות מקור מנוטרל, ו-``_resolveMode`` מחזיר surface/screen בלבד.
  // ההעדפה נשמרת לכל לוח בנפרד, מקומית. אין כאן שינוי סכמה ואין קריאת
  // רשת — זו העדפת תצוגה, לא נתון.
  const INFINITE_KEY = 'board-infinite:' + BOARD_ID;
  function readInfinite() {
    try { return localStorage.getItem(INFINITE_KEY) === '1'; } catch (e) { return false; }
  }
  function writeInfinite(on) {
    try { localStorage.setItem(INFINITE_KEY, on ? '1' : '0'); } catch (e) { /* מצב זמני בלבד */ }
  }

  window._boardNotes = new window.StickyNotesManager({
    board: BOARD_ID,
    container: surface,
    anchorHost: null,
    infiniteScroll: readInfinite()
  });

  const settingsModal = document.getElementById('boardSettings');
  const settingsBtn = document.getElementById('boardSettingsBtn');
  const infiniteToggle = document.getElementById('infiniteScrollToggle');
  infiniteToggle.checked = readInfinite();

  // ``aria-modal="true"`` מצהיר בפני קורא מסך שכל מה שמאחורי הדיאלוג
  // אינו קיים. בלי לכידת Tab ההצהרה הזו פשוט אינה נכונה: משתמש מקלדת
  // ממשיך לגלוש לשדה שם הלוח, לפתקים ולנאבבר — ומקליד בהם בזמן שהדיאלוג
  // עדיין על המסך.
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), ' +
                    'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function focusableItems() {
    return Array.prototype.filter.call(
      settingsModal.querySelectorAll(FOCUSABLE),
      function (n) { return n.offsetParent !== null || n === document.activeElement; }
    );
  }

  function openSettings() { settingsModal.hidden = false; infiniteToggle.focus(); }
  function closeSettings() { settingsModal.hidden = true; settingsBtn.focus(); }

  settingsBtn.addEventListener('click', openSettings);
  settingsModal.addEventListener('click', function (ev) {
    if (ev.target && ev.target.hasAttribute('data-close')) closeSettings();
  });
  document.addEventListener('keydown', function (ev) {
    if (settingsModal.hidden) return;
    if (ev.key === 'Escape') { closeSettings(); return; }
    if (ev.key !== 'Tab') return;
    const items = focusableItems();
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    // הלולאה נסגרת בשני הכיוונים, וגם מחזירה פנימה פוקוס שהצליח לברוח
    if (ev.shiftKey && (document.activeElement === first || !settingsModal.contains(document.activeElement))) {
      ev.preventDefault(); last.focus();
    } else if (!ev.shiftKey && (document.activeElement === last || !settingsModal.contains(document.activeElement))) {
      ev.preventDefault(); first.focus();
    }
  });
  infiniteToggle.addEventListener('change', function () {
    writeInfinite(infiniteToggle.checked);
    window._boardNotes.setInfiniteScroll(infiniteToggle.checked);
  });

  document.getElementById('firstNoteBtn').addEventListener('click', function () {
    window._boardNotes.createNote();
  });

  // גובה המשטח נמדד מהמיקום בפועל ולא מנוחש. הערך הקשיח הקודם
  // (``100vh - 130px``) פספס ב-40 פיקסלים ויצר גלילה מיותרת בכל טעינה.
  function measureBoardTop() {
    try {
      const top = Math.round(surface.getBoundingClientRect().top + window.scrollY);
      document.documentElement.style.setProperty('--board-top', top + 'px');
      // הגובה שממלא בדיוק את המסך — ``_updateSurfaceExtent`` מרחיב מעבר לו
      document.documentElement.style.setProperty('--board-fill',
        Math.max(200, window.innerHeight - top - 8) + 'px');
    } catch (e) { /* נשארת נפילה חיננית לערך שב-CSS */ }
  }
  measureBoardTop();
  window.addEventListener('resize', measureBoardTop, { passive: true });
  if (typeof ResizeObserver !== 'undefined') {
    try { new ResizeObserver(measureBoardTop).observe(document.body); } catch (e) {}
  }

  loadBoard();
  refreshEmptyState();
  // המצב הריק מתעדכן לפי מה שבאמת על המשטח, ולא לפי ספירה שנשמרת בצד
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(refreshEmptyState).observe(surface, { childList: true });
  }
})();
</script>
{% endblock %}
