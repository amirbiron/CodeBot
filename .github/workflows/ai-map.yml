name: 🗺️ AI Docs Map

# מרענן את AI-MAP.md (מפת התיעוד לסוכנים) אחרי כל שינוי בתיעוד שהגיע
# ל-main. רץ אחרי המיזוג ולא על ה-PR בכוונה: דחיפה של GITHUB_TOKEN לענף
# PR אינה מפעילה מחדש את בדיקות החובה, וה-PR היה נתקע ממתין להן. המפה
# היא ממילא תוצר נגזר — אין ערך ריוויו ל-diff שלה.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generate_ai_map.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# מוגדר לפי ref כדי שהרצה ידנית מענף אחר לא תבטל רענון רץ של main
concurrency:
  group: ai-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-map:
    # רק על main: הרצה ידנית מ-ref אחר הייתה, בכשל דחיפה, פותחת PR
    # שגורר את הקומיטים הזרים של אותו ref לתוך main. ההגבלה גם הופכת
    # את ענף האוטומציה המשותף לבטוח — כל הריצות באותה קבוצת concurrency.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # לא שומרים שום טוקן ב-.git/config: ברירת המחדל של checkout
          # משאירה אותו שם לכל אורך הריצה, וקוד שרץ בשלבים הבאים (המחולל)
          # היה יכול לקרוא אותו. האישור מוזרק נקודתית בשלב הדחיפה בלבד.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate AI-MAP.md
        run: python3 scripts/generate_ai_map.py --out AI-MAP.md

      - name: Commit if changed
        env:
          # PAT (אם מוגדר) עדיף על GITHUB_TOKEN: דחיפה ו-PR שנוצרים בו כן
          # מפעילים את בדיקות החובה. הטוקן חי רק בסביבת השלב הזה, והסקריפט
          # מנקה אותו (env -u) לפני כל הרצה של קוד פייתון מהריפו.
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.REPO_ADMIN_TOKEN != '' }}
        run: bash .github/scripts/publish-ai-map.sh
