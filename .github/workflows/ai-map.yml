name: 🗺️ AI Docs Map

# מרענן את AI-MAP.md (מפת התיעוד לסוכנים) אחרי כל שינוי בתיעוד שהגיע
# ל-main. רץ אחרי המיזוג ולא על ה-PR בכוונה: דחיפה של GITHUB_TOKEN לענף
# PR אינה מפעילה מחדש את בדיקות החובה, וה-PR היה נתקע ממתין להן. המפה
# היא ממילא תוצר נגזר — אין ערך ריוויו ל-diff שלה.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generate_ai_map.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# מוגדר לפי ref כדי שהרצה ידנית מענף אחר לא תבטל רענון רץ של main
concurrency:
  group: ai-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-map:
    # רק על main: הרצה ידנית מ-ref אחר הייתה, בכשל דחיפה, פותחת PR
    # שגורר את הקומיטים הזרים של אותו ref לתוך main. ההגבלה גם הופכת
    # את ענף האוטומציה המשותף לבטוח — כל הריצות באותה קבוצת concurrency.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # checkout שומר את הטוקן הזה בקונפיג של git, וכל git push משתמש
          # בו — GH_TOKEN למטה משפיע רק על gh. בלי PAT כאן, גם דחיפה לענף
          # האוטומציה הייתה ב-GITHUB_TOKEN ואירוע ה-synchronize לא היה
          # מפעיל את בדיקות החובה.
          token: ${{ secrets.REPO_ADMIN_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate AI-MAP.md
        run: python3 scripts/generate_ai_map.py --out AI-MAP.md

      - name: Commit if changed
        env:
          # PAT (אם מוגדר) עדיף על GITHUB_TOKEN: PR שנוצר בו כן מפעיל את
          # בדיקות החובה. בלעדיו — ראו ההערה על ה-PR למטה.
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.REPO_ADMIN_TOKEN != '' }}
        run: |
          # git diff מפספס קובץ שאינו tracked עדיין; porcelain תופס את שניהם
          if [ -z "$(git status --porcelain -- AI-MAP.md)" ]; then
            echo "המפה עדכנית — אין מה לקמט"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add AI-MAP.md
          git commit -m "docs: רענון אוטומטי של AI-MAP.md"
          # ניסיון ראשון: דחיפה ישירה (עובדת כשאין הגנת ענף חוסמת).
          if git push; then
            echo "נדחף ישירות ל-main"
            exit 0
          fi
          # non-fast-forward: תיעוד חדש נכנס בינתיים. אחרי ה-rebase המפה
          # שנוצרה כבר מיושנת — מייצרים מחדש ומעדכנים את הקומיט, אחרת היינו
          # דוחפים מפה ישנה על תיעוד חדש (והקומיט שלנו לא מפעיל ריצה נוספת,
          # כי הוא נוגע רק ב-AI-MAP.md שאינו ב-paths).
          if git pull --rebase; then
            python3 scripts/generate_ai_map.py --out AI-MAP.md
            git add AI-MAP.md
            git commit --amend --no-edit
            if git push; then
              echo "נדחף אחרי rebase וייצור מחדש"
              exit 0
            fi
          else
            # rebase שנכשל (קונפליקט על AI-MAP.md מריצה מקבילה) משאיר את
            # עץ העבודה באמצע rebase, וכל פקודה הבאה הייתה נכשלת עם שגיאה
            # מבלבלת. מנקים לפני ה-fallback.
            git rebase --abort || true
          fi
          # הגנת ענף דחתה את הדחיפה — נפילה מבוקרת לענף אוטומציה + PR.
          # הענף נבנה מ-origin/main נקי והמפה מיוצרת בו מחדש, כך שהוא
          # מכיל בדיוק קומיט אחד ולעולם לא גורר היסטוריה מקומית חלקית.
          # הענף קבוע, כך שריצות חוזרות מעדכנות את אותו PR במקום לערום חדשים.
          echo "דחיפה ישירה נדחתה — עובר לענף אוטומציה"
          git fetch origin main
          git checkout -B automation/ai-map-refresh origin/main
          python3 scripts/generate_ai_map.py --out AI-MAP.md
          if [ -z "$(git status --porcelain -- AI-MAP.md)" ]; then
            echo "אחרי הסנכרון המפה כבר עדכנית ב-main — אין צורך ב-PR"
            exit 0
          fi
          git add AI-MAP.md
          git commit -m "docs: רענון אוטומטי של AI-MAP.md"
          git push -f origin automation/ai-map-refresh
          # gh pr list מחזיר רשימה ריקה כשאין PR ונכשל ברעש על שגיאת
          # API/הרשאה — בניגוד ל-pr view, שבו כשל אמיתי נראה כמו "אין PR".
          state=$(gh pr list --head automation/ai-map-refresh --base main --state open --json state --jq '.[0].state // "NONE"')
          if [ "$state" = "OPEN" ]; then
            echo "PR פתוח כבר קיים — הענף עודכן והוא התעדכן בו"
            exit 0
          fi
          gh pr create \
            --title "docs: רענון אוטומטי של AI-MAP.md" \
            --body "$(printf 'רענון מפת התיעוד אחרי שינוי ב-docs/. נוצר אוטומטית על ידי ai-map.yml כי דחיפה ישירה ל-main נדחתה (הגנת ענף).\n\nאם בדיקות החובה לא הופעלו (PR שנוצר ב-GITHUB_TOKEN אינו מפעיל אותן) — סגרו ופתחו מחדש את ה-PR, או הגדירו את הסוד REPO_ADMIN_TOKEN כדי שזה יקרה אוטומטית.')" \
            --base main --head automation/ai-map-refresh
          # בלי PAT, ה-PR שנוצר כרגע תקוע: בדיקות החובה לא ירוצו עליו
          # מעצמן. PR חסום בשקט הוא בדיוק מה שאסור להשאיר כברירת מחדל —
          # מפילים את הריצה ברעש כדי שהמצב יגיע להתראה, עם הוראות תיקון.
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::נוצר PR אבל בדיקות החובה לא ירוצו עליו (אין REPO_ADMIN_TOKEN). סגרו ופתחו מחדש את ה-PR להפעלת הבדיקות, או הגדירו את הסוד. הריצה מסומנת ככשל בכוונה כדי שהמצב לא יישאר שקט."
            exit 1
          fi
