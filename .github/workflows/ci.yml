name: CI/CD Pipeline

on:
  push: 
    branches: [ 'main', 'rollback/**' ]
    # אל תתעלם משינויים ב-.cursorrules כדי שה-CI ירוץ גם על PRים שמעדכנים אותו
  pull_request:
    branches: [ '**' ]
    types: [opened, synchronize, reopened, ready_for_review]
    # אל תתעלם מ-.cursorrules גם כאן
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  code-quality:
    name: "🔍 Code Quality & Security"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements/*.txt
      - name: 📦 Install Linters & Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy bandit safety ruff pip-audit
      # חוסם, ובכוונה — בניגוד לרוב הצעדים כאן שמסתיימים ב-``|| true``.
      # קובץ bytecode שנכנס לעץ אינו נתפס בשום בדיקה אחרת: אין שגיאה, אין
      # אזהרה, ו-.gitignore אינו חל על קובץ שכבר ב-index. הצעד רץ ראשון כי
      # הוא זול (קריאת git אחת) והכשל שלו חד-משמעי.
      - name: 🧹 No committed bytecode
        run: python scripts/check_no_committed_pyc.py

      - name: 📋 Lint (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: 🎨 Format Check (Black)
        run: black --check --diff . || true
      - name: 🔡 Import Sort Check (isort)
        run: isort --check-only --diff . || true
      - name: 🏷️ Type Check (MyPy)
        run: |
          # Run focused strict checks for modules we hardened
          mypy services/code_service.py services/__init__.py code_preview.py autocomplete_manager.py --config-file mypy.ini --show-error-codes
          # Run broad, permissive pass for the rest (non-blocking for now)
          mypy . --ignore-missing-imports --show-error-codes | tee mypy-output.txt || true
          # תופסים רק שורות "error:" אמיתיות. ב-mypy חדש יש שורות "note:" כמו
          # 'Error code ... not covered by "type: ignore[attr-defined]" comment'
          # שמכילות את הסוגריים אבל אינן שגיאה.
          #
          # ``call-arg`` — קריאה שחסר בה ארגומנט חובה, או שיש בה ארגומנט שאינו
          # קיים. בפייתון זה ``TypeError`` בזמן הקריאה ולא בייבוא, ולכן אתר קריאה
          # בלי כיסוי טסט נופל רק בייצור. ``max_size`` של ``_apply_edit``
          # (``mcp_server/handlers.py``) הוא חובה בדיוק כדי שקורא ששכח ייתפס כאן
          # (#3495).
          if grep -E ': error:.*\[(attr-defined|return-value|call-arg)\]' mypy-output.txt; then
            echo "Found mypy attr-defined/return-value/call-arg errors above"
            exit 1
          fi
      - name: 🔒 Security Scan (Bandit)
        run: bandit -q -r . || true
      - name: 🛡️ Dependency Check (Safety)
        run: safety check --full-report || true
      - name: 📦 Dependency Audit (pip-audit)
        run: |
          pip-audit -r requirements/production.txt -f json -o pip-audit.json || true
      - name: 📊 Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: pip-audit.json
          if-no-files-found: ignore
      - name: 🐶 Ruff (optional)
        run: ruff check . || true

      - name: Report required status (pending)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: 'Code Quality & Security',
              description: 'Job queued/running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Report required status (success)
        if: ${{ success() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'Code Quality & Security',
              description: 'Checks passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Report required status (failure)
        if: ${{ failure() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'Code Quality & Security',
              description: 'Checks failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Report required status (cancelled)
        if: ${{ cancelled() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: 'Code Quality & Security',
              description: 'Job cancelled',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  unit-tests:
    # שני מסלולים לכל גרסת פייתון, שרצים במקביל. ``main`` מריץ את כל הטסטים חוץ
    # מאלה שמסומנים ``md_heavy`` (הרישום ב-``pytest.ini``), ו-``md-heavy`` מריץ רק
    # אותם. הם במסלול משלהם כי הם מפרסרים קלט ענק בתקרות של פרסר ה-Markdown, וכך
    # הם אינם מאריכים את המסלול שכל PR מחכה לו. ראו docs/ci-cd.rst.
    #
    # כל מסלול מדווח סטטוס חובה משלו בשם ``<label> (<python-version>)``. שמות
    # הסטטוסים כתובים גם ברשימות של בדיקות החובה בתיעוד ובתבניות, ו-
    # ``tests/test_required_checks_are_listed.py`` משווה אותן למטריצה הזו.
    name: "${{ matrix.label }} (${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]
        suite: ['main', 'md-heavy']
        include:
          - suite: main
            label: 'Unit Tests'
            marker: 'not md_heavy'
          - suite: md-heavy
            label: 'Unit Tests md-heavy'
            marker: 'md_heavy'
          # coverage נמדד בגרסה אחת בלבד, כדי לא לשלם פעמיים על ההאטה שהוא מוסיף לטסטים.
          # 3.11, כי זו הגרסה שהפרודקשן רץ עליה (Dockerfile). הרשומה מוסיפה את
          # ``coverage: true`` לכל המסלולים של הגרסה הזו: רשומת include מתווספת לכל צירוף
          # שהיא לא דורסת בו ערך מקורי של המטריצה
          # (``jobs.<job_id>.strategy.matrix.include`` בתיעוד של GitHub Actions).
          - python-version: '3.11'
            coverage: true
    services:
      # המסלול ``md-heavy`` אינו צריך מסד: ``image`` ריק אומר ל-runner לא להרים את
      # השירות (``jobs.<job_id>.services.<service_id>.image`` בתיעוד של GitHub
      # Actions).
      mongodb:
        # 8.0 ולא 6.0, כי הפרודקשן רץ על MongoDB Atlas 8.0 — בדיקה שרצה מול
        # מסד אמיתי צריכה לבדוק את אותו מנוע. בפרט ``queryShapeHash`` בפלט של
        # ``explain`` קיים רק מ-8.0 ומעלה, ו-tests/test_profiler_projection_mongo.py
        # נשען עליו. ראו docs/testing.rst.
        image: ${{ matrix.suite == 'main' && 'mongo:8.0' || '' }}
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test123
        # Avoid host port binding to prevent conflicts; job connects via service hostname
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ${{ matrix.suite == 'main' && 'redis:7-alpine' || '' }}
        # Avoid host port binding; job connects via service hostname
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements/*.txt
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # התקנה ראשונית (לצורך יצירת constraints)
          pip install -r requirements/development.txt
          # הפקת constraints אוטומטי ושימוש בו
          pip freeze | sort > constraints.txt
          pip install -r requirements/development.txt -c constraints.txt
      - name: 🔎 Dependency integrity (pip check)
        run: pip check || true

      # שם הסטטוס נבנה מהמטריצה, באותה צורה כמו ``name`` של הג'וב, כך שכל מסלול
      # כותב רק לסטטוס שלו. GitHub קובע את מצב הסטטוס לפי הדיווח האחרון לכל שם
      # (REST, "Commit statuses"), ולכן שני מסלולים שכותבים לאותו שם היו דורסים זה
      # את זה — והצלחה של אחד הייתה מסתירה כשל של השני.
      - name: Report required status (pending)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Job queued/running',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
        env:
          STATUS_CONTEXT: "${{ matrix.label }} (${{ matrix.python-version }})"
      # בדיקת תחביר על כל הריפו — לא תלויה במסלול, ולכן רצה פעם אחת לכל גרסה.
      - name: 🧪 Smoke compile (exclude .restore)
        if: matrix.suite == 'main'
        run: |
          find . -type f -name "*.py" -not -path "./.restore/*" -print0 | xargs -0 -n1 -P 4 python -m py_compile
      - name: 🧪 Run Tests
        env:
          BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN || '1234567890:TEST_TOKEN_FOR_TESTING' }}
          MONGODB_URL: mongodb://test:test123@mongodb:27017/test_db?authSource=admin
          # מסד אמיתי לבדיקות שאינן יכולות לרוץ מול סטאב (הפיקסצ'ר
          # ``wired_mongo``). משתנה ייעודי ולא ``MONGODB_URL``, כי
          # ``tests/conftest.py`` מציב לאחרון ערך דמה כברירת מחדל —
          # ובלי ההפרדה אי אפשר להבחין בין "יש מונגו" ל"יש placeholder".
          #
          # ⚠️ כרגע הכתובת הזו **אינה נגישה** והבדיקות מדלגות: הג'וב אינו
          # רץ בקונטיינר והשירות מוגדר בלי ``ports:``, ולכן המארח
          # ``mongodb`` אינו נפתר. ראו את האזהרה ב-docs/testing.rst.
          # המשתנה נשאר כאן במכוון — ברגע שיתווסף ``ports:`` והכתובת
          # תשתנה ל-127.0.0.1, הבדיקות יתחילו לרוץ בלי לזכור דבר.
          NOTE_FONTS_TEST_MONGO_URI: mongodb://test:test123@mongodb:27017/test_db?authSource=admin
          REDIS_URL: redis://redis:6379/0
          GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          PASTEBIN_API_KEY: ${{ secrets.TEST_PASTEBIN_KEY }}
          FEATURE_MY_COLLECTIONS: '1'
          # ערכי הבדיקה של ההמתנות שקוד הייצור עושה בכוונה — rate limit, retry, backoff —
          # נקבעים ב-tests/conftest.py ולא כאן, כדי שיחולו על כל הרצה של הטסטים: גם
          # deploy.yml וגם הרצה מקומית. ראו docs/testing.rst.
        # ``-m`` בוחר את הטסטים של המסלול (``matrix.marker``). מסלול שלא נבחר בו אף
        # טסט נכשל ולא עובר בשקט: pytest יוצא בקוד 5 כשלא נאסף אף טסט, גם כשכולם
        # סוננו ב-``-m`` (נמדד ב-pytest 8.4.2, עם ``-n`` ובלעדיו). כך שם סימון ששונה
        # כאן ולא בטסטים, או בכל הטסטים ולא כאן, מפיל את המסלול ``md-heavy``. טסט בודד
        # שהסימון שלו חסר או שגוי פשוט רץ במסלול הרגיל. את קוד היציאה, ואת זה ששני
        # הביטויים משלימים זה את זה, מקבע ``tests/test_required_checks_are_listed.py``.
        #
        # דגלי ה-coverage עוברים רק במסלולים ש-``matrix.coverage`` דלוק בהם. בשאר המסלולים
        # המאפיין לא מוגדר, ומאפיין שלא קיים מחזיר מחרוזת ריקה (contexts בתיעוד של GitHub
        # Actions); ``&&`` ו-``||`` מחזירים את הערך עצמו ולא true/false (``And.cs`` ו-``Or.cs``
        # ב-actions/runner), ולכן שם הביטוי ריק. אותו טסט בודק שאין ``--cov`` מחוץ לביטוי.
        run: |
          pytest -n auto --dist=loadscope -v -o addopts="" -m "${{ matrix.marker }}" \
                 ${{ matrix.coverage && '--cov=. --cov-report=xml --cov-report=term' || '' }} \
                 --durations=0 --json-report --json-report-file=unit-durations.json

      - name: Upload coverage to Codecov
        # רק במסלולים שמדדו coverage. Codecov ממזג את ההעלאות של אותו קומיט, ובלי
        # ``after_n_builds`` ב-codecov.yml הוא לא מחכה למספר מסוים שלהן.
        if: ${{ always() && matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload unit test durations artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # שם ייחודי לכל מסלול: ``upload-artifact@v4`` אינו מאפשר שתי העלאות לאותו
          # שם. הקידומת ``unit-durations-`` נשארת, כי ``notify-post-merge-issue.yml``
          # מחפש לפיה את הדוחות שבהם נספרים טסטים שנכשלו.
          name: unit-durations-${{ matrix.suite }}-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            unit-durations.json
          if-no-files-found: ignore

      - name: Report required status (success)
        if: ${{ success() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: process.env.STATUS_CONTEXT,
              description: 'Tests passed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
        env:
          STATUS_CONTEXT: "${{ matrix.label }} (${{ matrix.python-version }})"

      - name: Report required status (failure)
        if: ${{ failure() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: process.env.STATUS_CONTEXT,
              description: 'Tests failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
        env:
          STATUS_CONTEXT: "${{ matrix.label }} (${{ matrix.python-version }})"

      - name: Report required status (cancelled)
        if: ${{ cancelled() }}
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : context.sha;
            await github.request('POST /repos/{owner}/{repo}/statuses/{sha}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'failure',
              context: process.env.STATUS_CONTEXT,
              description: 'Job cancelled',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
        env:
          STATUS_CONTEXT: "${{ matrix.label }} (${{ matrix.python-version }})"

  js-tests:
    name: "JS Tests (node)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v5 ולא v4: ``action.yml`` של v4 מצהיר ``runs.using: node20``, וזה
      # ה-runtime שהוצא משימוש. v5 ומעלה מצהירים ``node24``. נבחר המינימום
      # שפותר, ולא הגרסה החדשה ביותר, כדי לא לייבא שינויי התנהגות נוספים.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # קבצי tests/*.test.js הם סקריפטים עצמאיים: הם מריצים את הבדיקות
      # בעצמם ויוצאים עם קוד שגיאה בכשל, בלי רץ טסטים חיצוני. עד עכשיו
      # שום ג'וב לא הריץ אותם, ולכן 200+ בדיקות לא הגנו על כלום.
      - name: Run standalone JS tests
        run: |
          set -uo pipefail
          # קבצי tests/*.test.js הם סקריפטים עצמאיים. קובץ שכתוב לרץ טסטים
          # (describe/it) ואינו מייבא אותו אינו ניתן להרצה כאן — **מזוהה
          # לפי תוכנו ולא לפי שמו**, כדי שקובץ חדש כזה לא ידרוש חריגה
          # ידנית חדשה ולא ייפול עם stack trace חסר פשר.
          #
          # קובץ כזה נספר ככשל, לא כדילוג: דילוג היה נראה כאילו הוא נבדק.
          # החריג היחיד המוכר הוא repo-history.test.js, ששרד מתוכנית Jest
          # שמעולם לא מומשה (ראו GUIDES/*.md). הוא גם אינו טוען את הקוד
          # שהוא אמור לבדוק — אין בו import ואין require, הוא מגדיר את
          # הפונקציות בתוך עצמו ובודק את ההעתקים. הדרך להסיר את החריג היא
          # לכתוב אותו מחדש כך שיטען את המקור, או למחוק אותו.
          GRANDFATHERED="repo-history.test.js"
          failed=0
          for f in tests/*.test.js; do
            name="$(basename "$f")"
            if [ "$name" = "$GRANDFATHERED" ]; then
              echo ":: מדולג (חריג מוכר): $name — סגנון רץ טסטים, ואינו טוען את הקוד שהוא בודק"
              continue
            fi
            echo "── $name"
            if ! node "$f"; then
              failed=1
            fi
          done
          exit "$failed"

  hadolint:
    name: "Dockerfile lint (hadolint)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  gitleaks:
    name: "Secrets scan (gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-banner --redact --source .
        continue-on-error: true

  semgrep:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          generateSarif: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  yamllint:
    name: "YAML lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
        continue-on-error: true

  lychee:
    name: "Link checker (lychee)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress README.md docs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  alembic-migrations:
    name: "Alembic migrations check"

    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Check if alembic.ini exists
        id: has_alembic
        run: |
          if [ -f alembic.ini ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if missing
        if: steps.has_alembic.outputs.exists == 'false'
        run: echo "alembic.ini not found; skipping migration check."
      - uses: actions/setup-python@v5
        if: steps.has_alembic.outputs.exists == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        if: steps.has_alembic.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/production.txt
          pip freeze | sort > constraints.txt
          pip install -r requirements/production.txt -c constraints.txt
          pip install alembic psycopg2-binary
      - name: Wait for DB
        if: steps.has_alembic.outputs.exists == 'true'
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              break
            fi
            sleep 2
          done
      - name: Run Alembic migrations
        if: steps.has_alembic.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: |
          alembic upgrade head

